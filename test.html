<!DOCTYPE html>
<html>
<head>
    <title>Public Live Bridge</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mqtt/4.3.7/mqtt.min.js"></script>
    <style>
        body { font-family: sans-serif; display: flex; gap: 20px; padding: 20px; background: #f0f0f0; }
        .box { border: 2px solid #333; padding: 20px; border-radius: 10px; background: white; flex: 1; }
        .data { font-family: monospace; font-size: 1.5rem; color: #d32f2f; }
        .status { font-size: 0.8rem; color: #666; margin-top: 10px; }
    </style>
</head>
<body>

    <div class="box">
        <h2>Sender</h2>
        <p>Pushing live stats to public broker...</p>
        <div id="send-log">---</div>
    </div>

    <div class="box">
        <h2>E-Paper Preview</h2>
        <div class="data" id="temp">TEMP: --</div>
        <div class="data" id="speed">SPD: --</div>
        <div id="arrival" class="status">Waiting for data...</div>
    </div>

    <script>
        // Connect to a free public broker
        const client = mqtt.connect('wss://broker.hivemq.com:8000/mqtt');
        const topic = "myUniqueProject/stats/12345"; // Change 12345 to something random

        client.on('connect', () => {
            console.log("Connected to Public Broker");
            client.subscribe(topic);

            // Start Pushing Data
            setInterval(() => {
                const payload = JSON.stringify({
                    temp: (Math.random() * 10 + 50).toFixed(1) + "°C",
                    speed: (Math.random() + 3).toFixed(1) + "GHz",
                    time: new Date().toLocaleTimeString()
                });
                client.publish(topic, payload);
                document.getElementById('send-log').innerText = "Sent: " + payload;
            }, 3000);
        });

        // Receiving Data
        client.on('message', (t, message) => {
            const data = JSON.parse(message.toString());
            document.getElementById('temp').innerText = "TEMP: " + data.temp;
            document.getElementById('speed').innerText = "SPD: " + data.speed;
            document.getElementById('arrival').innerText = "Received at: " + data.time;
        });
    </script>
</body>
</html>
