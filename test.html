<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>E-Ink Prototyper</title>
    <style>
        body { font-family: sans-serif; background: #222; color: #fff; margin: 0; display: flex; height: 100vh; overflow: hidden; }
        
        /* Left Side: Editor */
        #editor-pane { width: 40%; padding: 20px; display: flex; flex-direction: column; border-right: 2px solid #444; }
        textarea { flex-grow: 1; background: #111; color: #00ff00; font-family: monospace; padding: 10px; border: 1px solid #555; resize: none; }
        .controls { margin-top: 10px; display: flex; gap: 10px; align-items: center; }
        
        /* Right Side: Preview */
        #preview-pane { width: 60%; display: flex; flex-direction: column; align-items: center; justify-content: center; background: #333; }
        
        /* The Simulated E-Ink Screen (Match your hardware resolution here) */
        #eink-screen { 
            width: 800px; 
            height: 480px; 
            background: #fff; 
            color: #000; 
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
            overflow: hidden;
            position: relative;
        }

        button { padding: 10px 20px; cursor: pointer; background: #444; color: white; border: 1px solid #666; }
        button:hover { background: #555; }
        .active-btn { background: #007bff; border-color: #0056b3; }
        .status { font-size: 0.8rem; color: #aaa; }
    </style>
</head>
<body>

<div id="editor-pane">
    <h2>E-Ink Code Lab</h2>
    <p class="status">Paste your HTML/CSS here. Use 800x480 resolution.</p>
    <textarea id="code-input">
<div style="padding: 20px; height: 100%;">
    <h1 style="border-bottom: 3px solid red;">CALENDAR</h1>
    <div style="font-size: 24px; margin-top: 20px;">
        <p>• 08:00 - Dispatch Shift</p>
        <p>• 14:00 - Radio Maintenance</p>
        <p>• 19:00 - Dinner in Anderson</p>
    </div>
</div>

<div style="padding: 20px; text-align: center; height: 100%;">
    <h1 style="color: red;">WEATHER</h1>
    <div style="font-size: 80px; font-weight: bold;">72°F</div>
    <div style="font-size: 30px;">Partly Cloudy</div>
    <p>Anderson, SC</p>
</div>
    </textarea>
    
    <div class="controls">
        <button onclick="updatePreview()" class="active-btn">Refresh Preview</button>
        <button id="rotate-btn" onclick="toggleRotation()">Start Rotation</button>
        <span id="timer-display"></span>
    </div>
</div>

<div id="preview-pane">
    <div id="eink-screen">
        </div>
    <p class="status" style="margin-top: 15px;">Resolution: 800 x 480 (Color E-Ink Simulation)</p>
</div>

<script>
    let pages = [];
    let currentPage = 0;
    let rotationInterval = null;

    function updatePreview() {
        const rawCode = document.getElementById('code-input').value;
        // We use "" as a delimiter to separate screens
        pages = rawCode.split('');
        renderPage(0);
    }

    function renderPage(index) {
        const screen = document.getElementById('eink-screen');
        if(pages[index]) {
            screen.innerHTML = pages[index];
            currentPage = index;
        }
    }

    function toggleRotation() {
        const btn = document.getElementById('rotate-btn');
        if (rotationInterval) {
            clearInterval(rotationInterval);
            rotationInterval = null;
            btn.innerText = "Start Rotation";
            btn.classList.remove('active-btn');
        } else {
            updatePreview();
            btn.innerText = "Stop Rotation";
            btn.classList.add('active-btn');
            rotationInterval = setInterval(() => {
                currentPage = (currentPage + 1) % pages.length;
                renderPage(currentPage);
            }, 5000); // Rotates every 5 seconds
        }
    }

    // Initial load
    updatePreview();
</script>

</body>
</html>
