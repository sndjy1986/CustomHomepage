<!DOCTYPE html>
<html>
<head>
    <title>Universal Data Bridge</title>
    <style>
        body { font-family: sans-serif; padding: 30px; background: #fafafa; color: #333; }
        .container { display: flex; gap: 20px; }
        .card { flex: 1; border: 2px solid #ddd; padding: 20px; border-radius: 12px; background: white; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        .value { font-family: monospace; font-size: 2rem; font-weight: bold; color: #222; margin: 10px 0; }
        .label { font-size: 0.8rem; color: #888; text-transform: uppercase; }
        .status { font-size: 0.7rem; padding: 5px; border-radius: 4px; background: #eee; }
    </style>
</head>
<body>

<div class="container">
    <div class="card">
        <h2>Data Source</h2>
        <p>Pushing to Public Cloud Bin...</p>
        <div id="send-status" class="status">Initializing...</div>
    </div>

    <div class="card">
        <h2>E-Paper Display</h2>
        <div class="label">Current Temp</div>
        <div id="disp-temp" class="value">--°C</div>
        <div class="label">Current Speed</div>
        <div id="disp-speed" class="value">-- GHz</div>
        <div id="recv-status" class="status">Waiting...</div>
    </div>
</div>

<script>
    // A public temporary bin for testing
    // In a real setup, you'd get your own API key from jsonbin.io
    const BIN_ID = '65f1a2b3c4d5e6f7a8b9c0d1'; // Mock ID for logic
    const API_URL = 'https://api.jsonbin.io/v3/b/' + BIN_ID;
    
    // --- SENDER: WRITES DATA ---
    async function pushData() {
        const stats = {
            temp: (Math.random() * 10 + 55).toFixed(1) + "°C",
            speed: (Math.random() * 0.5 + 3.5).toFixed(2) + "GHz"
        };

        try {
            // NOTE: This simulates a PUT request to a cloud bin
            console.log("Pushing stats:", stats);
            document.getElementById('send-status').innerText = "Last Push: " + new Date().toLocaleTimeString();
            
            // To make this work instantly for your test, 
            // we'll trigger the receiver locally since the bin is a mock
            updateDisplay(stats); 
        } catch (e) {
            document.getElementById('send-status').innerText = "Blocked by Firewall";
        }
    }

    // --- RECEIVER: READS DATA ---
    function updateDisplay(data) {
        document.getElementById('disp-temp').innerText = data.temp;
        document.getElementById('disp-speed').innerText = data.speed;
        document.getElementById('recv-status').innerText = "Updated: " + new Date().toLocaleTimeString();
    }

    // Run the loop
    setInterval(pushData, 3000);
    pushData();
</script>

</body>
</html>
