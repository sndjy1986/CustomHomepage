<!DOCTYPE html>
<html>
<head>
    <title>Telemetry Sender</title>
    <style>
        body { font-family: sans-serif; padding: 20px; background: #f4f4f9; }
        .card { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); max-width: 400px; }
        input { width: 100%; margin: 10px 0; padding: 8px; box-sizing: border-box; }
        button { background: #007bff; color: white; border: none; padding: 10px; width: 100%; cursor: pointer; }
    </style>
</head>
<body>
    <div class="card">
        <h2>System Stats Pusher</h2>
        <input type="text" id="cpuTemp" placeholder="CPU Temp (e.g. 55C)">
        <input type="text" id="cpuSpeed" placeholder="CPU Speed (e.g. 3.2GHz)">
        <input type="text" id="memUsage" placeholder="Memory Usage (e.g. 45%)">
        <input type="text" id="netIP" placeholder="Tailscale IP">
        <button onclick="sendData()">Push to E-Paper Bridge</button>
    </div>

    <script>
        async function sendData() {
            const stats = {
                temp: document.getElementById('cpuTemp').value,
                speed: document.getElementById('cpuSpeed').value,
                memory: document.getElementById('memUsage').value,
                ip: document.getElementById('netIP').value
            };

            // Replace with the Tailscale IP of the receiver machine
            const receiverIP = "http://100.x.y.z:3000/update"; 

            try {
                const response = await fetch(receiverIP, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(stats)
                });
                alert("Data Pushed!");
            } catch (err) {
                console.error("Error:", err);
                alert("Failed to reach Tailscale IP.");
            }
        }
    </script>
</body>
</html>
