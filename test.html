<!DOCTYPE html>
<html>
<head>
    <title>Live Data Source</title>
    <style>
        body { font-family: 'Courier New', monospace; background: #111; color: #0f0; padding: 40px; }
        .status { border: 1px solid #0f0; padding: 20px; display: inline-block; }
        .pulse { animation: blink 1s infinite; }
        @keyframes blink { 0% { opacity: 1; } 50% { opacity: 0.3; } 100% { opacity: 1; } }
    </style>
</head>
<body>
    <div class="status">
        <h2>[ SENSOR ACTIVE ]</h2>
        <p>Sending data to Tailscale Node...</p>
        <div id="out">Initializing...</div>
        <p class="pulse">● LIVE PUSHING</p>
    </div>

    <script>
        async function pushData() {
            // Simulated "Live" Data - replace these with real scrapers later
            const stats = {
                temp: (Math.random() * (65 - 45) + 45).toFixed(1) + "°C",
                speed: (Math.random() * (4.2 - 2.8) + 2.8).toFixed(1) + " GHz",
                memory: Math.floor(Math.random() * 100) + "%",
                ip: "100.10.20.30" // Your actual Tailscale IP
            };

            // TARGET: Change this to your Tailscale IP of the Receiver
            const receiverUrl = "http://100.x.y.z:3000/update"; 

            try {
                const response = await fetch(receiverUrl, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(stats)
                });
                
                document.getElementById('out').innerText = 
                    `Sent: ${stats.temp} | ${stats.speed} at ${new Date().toLocaleTimeString()}`;
            } catch (err) {
                document.getElementById('out').innerText = "CONNECTION ERROR: Check Tailscale.";
            }
        }

        // SET THE HEARTBEAT: Push every 5 seconds
        setInterval(pushData, 5000);
        pushData(); // Initial call
    </script>
</body>
</html>
